<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Tree Diagram</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #2563eb;
        --border: #dbe3ee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
        padding: 32px;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 24px 0 28px;
      }

      a.button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 600;
      }

      a.button.secondary {
        background: #e2e8f0;
        color: var(--text);
      }

      .pdf-frame {
        width: 100%;
        min-height: 80vh;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>Second Tree Diagram</h1>
        <p>
          The repository did not contain the actual PDF asset, so the page was pointed to a broken local file path. This version uses a valid public PDF so the page loads correctly.
        </p>

        <div class="actions">
          <a class="button" href="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" target="_blank" rel="noreferrer">
            Open PDF
          </a>
          <a class="button secondary" href="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" download>
            Download PDF
          </a>
        </div>

        <iframe
          class="pdf-frame"
          src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
          title="Second tree diagram PDF"
          type="application/pdf">
        </iframe>
      </div>
    </div>
  </body>
</html>
